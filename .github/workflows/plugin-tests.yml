name: ModelTrace Guard tests
on:
  push:
    paths: ['codex-plugin/**', '.agents/plugins/marketplace.json', 'static/**', 'templates/**', 'tools/build_pages.py', 'tests/*pages*.mjs', 'package*.json', 'data/gpt_reference.jsonl', 'data/claude_reference.jsonl', 'data/unified_bank.json', '.github/workflows/plugin-tests.yml']
  pull_request:
    paths: ['codex-plugin/**', '.agents/plugins/marketplace.json', 'static/**', 'templates/**', 'tools/build_pages.py', 'tests/*pages*.mjs', 'package*.json', 'data/gpt_reference.jsonl', 'data/claude_reference.jsonl', 'data/unified_bank.json', '.github/workflows/plugin-tests.yml']
permissions:
  contents: read
jobs:
  pages-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Jinja2>=3.1,<4'
      - run: python tools/build_pages.py --check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/ui-pages-api.test.mjs
      - run: npm run test:pages-guard
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node codex-plugin/build-plugin.mjs
      - run: node codex-plugin/validate-distribution.mjs
      - run: node codex-plugin/validate-reference-data.mjs
      - run: node --test codex-plugin/modeltrace-guard/tests/*.test.mjs
      - name: Ensure bundled assets match the current bank and scorer
        run: git diff --exit-code -- codex-plugin/modeltrace-guard/assets codex-plugin/modeltrace-guard/scripts/fingerprint-core.mjs codex-plugin/modeltrace-guard/web/modeltrace.css
